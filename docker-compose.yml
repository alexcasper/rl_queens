services:
  queens-training:
    build:
      context: .
      dockerfile: Dockerfile
    image: amd-synth-finetune:latest 
    
    devices:
      - /dev/kfd
      - /dev/dri
    
    ipc: host
    shm_size: '8gb'
    
    security_opt:
      - seccomp=unconfined
    
    group_add:
      - video
      - render
    
    env_file:
      - .env
    
    environment:
      - HIP_VISIBLE_DEVICES=0
      - HSA_OVERRIDE_GFX_VERSION=9.4.2
      
    volumes:
      - ./outputs_queens:/app/outputs_queens
      - ./cache:/app/cache
      - ./models:/app/models
      - ./model_checkpoints:/app/model_checkpoints
      - ./model_artifacts:/app/model_artifacts
      - ./logs:/app/logs
    
    command: python3 train_queens.py
